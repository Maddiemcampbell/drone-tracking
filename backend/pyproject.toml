[project]
name = "sensor-tracking-simulator"
version = "0.1.0"
description = "Deterministic educational sensor tracking simulation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
